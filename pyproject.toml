[project]
name = "vitalmake"
version = "0.1.0"
description = "Text-driven sound design for the Vital synthesizer: headless rendering, machine listening, and an MCP server"
authors = [
    { name = "0liver-pg", email = "oliverpascal.g@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cma>=4.5.0",
    "matplotlib>=3.11.2",
    "mcp[cli]>=2.2.0",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "vita>=0.1.0",
]

[project.scripts]
vitalmake = "vitalmake:main"
vitalmake-mcp = "vitalmake.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
